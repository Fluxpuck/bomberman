services:
  web:
    build:
      context: .
      args:
        # Baked into the client bundle at build time. localhost works when
        # browsing from the same machine that runs the compose stack.
        # For a Cloudflare Tunnel deployment set this to the public relay
        # URL, e.g. wss://ws.bomb-blast-arena.example.com
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3001}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - ws

  ws:
    build: .
    command: ["node", "server/ws-server.js"]
    environment:
      WS_PORT: 3001
    restart: unless-stopped
    ports:
      - "3001:3001"

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - web
      - ws
